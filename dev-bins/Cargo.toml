agave-reserved-account-keys = { path = "../ocios/reserved-account-keys", version = "=4.0.0", features = ["agave-unstable-api"] }
agave-snapshots = { path = "../ocios/snapshots", version = "=4.0.0", features = ["agave-unstable-api"] }
agave-syscalls = { path = "../ocios/syscalls", version = "=4.0.0", features = ["agave-unstable-api"] }
